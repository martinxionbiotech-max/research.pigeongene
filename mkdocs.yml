site_name: PigeonGene 科研中心
site_url: https://research.senopigeon.com
site_description: 赛鸽科研中心：真实可追溯文献、研究方向、方法论与证据分级，坚持科学严谨、绝不伪造
site_author: 张家口赛诺生物科技有限公司
copyright: © 张家口赛诺生物科技有限公司（SENO Biotech）

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.integrate
    - content.code.copy
  icon:
    logo: material/dna

nav:
  - 首页: index.md
  - 科研文献:
      - 科研文献总览: papers/index.md
      - 不同家鸽品种肌生成抑制素基因外显子 3 的单核苷酸多态性: papers/mstn-polymorphism-domestic-pigeon.md
      - 基因型谱与赛鸽比赛成绩关系的前瞻性研究: papers/genotype-profile-racing-performance.md
      - 赛鸽常备遗传变异的自然选择印记: papers/racing-pigeon-selection-signatures.md
      - 鸟类呼吸系统生物学: papers/avian-respiratory-biology.md
      - LDHA 基因多态性与赛鸽竞翔存活率: papers/ldha-snp-racing-performance.md
      - 数量遗传学导论（教科书）: papers/quantitative-genetics-textbook.md
      - 家鸽参考基因组与头冠多样性演化: papers/pigeon-reference-genome.md
      - 家鸽品种分化与野化种群祖先: papers/pigeon-divergence-ancestry.md
      - 鸟类基因组演化与适应性: papers/avian-genome-evolution.md
  - 研究方向:
      - 研究方向总览: research/index.md
      - 遗传学研究: research/genetics.md
      - 性能研究: research/performance.md
      - 归巢研究: research/homing.md
      - 耐力研究: research/endurance.md
      - 肌肉生理: research/muscle-physiology.md
      - 遗传标记: research/genetic-markers.md
      - DNA 检测: research/dna-testing.md
      - 方法论: research/methodology.md
      - 证据分级: research/evidence-grading.md
      - 文献阅读方法: research/reading-literature.md
  - 术语表: glossary.md

  - English:
      - Overview: en/index.md
      - Literature:
          - Literature Index: en/papers/index.md
          - MSTN Exon 3 SNPs in Domestic Pigeons: en/papers/mstn-polymorphism-domestic-pigeon.md
          - Genotype Profile and Racing Performance: en/papers/genotype-profile-racing-performance.md
          - Selection Signatures in Racing Pigeons: en/papers/racing-pigeon-selection-signatures.md
          - Avian Respiratory System Biology: en/papers/avian-respiratory-biology.md
          - LDHA Polymorphism and Survivability: en/papers/ldha-snp-racing-performance.md
          - Introduction to Quantitative Genetics: en/papers/quantitative-genetics-textbook.md
          - Pigeon Reference Genome and Crest: en/papers/pigeon-reference-genome.md
          - Pigeon Divergence and Feral Ancestry: en/papers/pigeon-divergence-ancestry.md
          - Avian Genome Evolution and Adaptation: en/papers/avian-genome-evolution.md
      - Research Directions:
          - Directions Overview: en/research/index.md
          - Genetics Research: en/research/genetics.md
          - Performance Research: en/research/performance.md
          - Homing Research: en/research/homing.md
          - Endurance Research: en/research/endurance.md
          - Muscle Physiology: en/research/muscle-physiology.md
          - Genetic Markers: en/research/genetic-markers.md
          - DNA Testing: en/research/dna-testing.md
          - Methodology: en/research/methodology.md
          - Evidence Grading: en/research/evidence-grading.md
          - How to Read the Literature: en/research/reading-literature.md
      - Glossary: en/glossary.md

hooks:
  - hooks/i18n_lang.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang: zh
